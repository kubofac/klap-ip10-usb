<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSerial Polyfill - ESP32 接続テスト</title>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.5; }
    button { padding: 10px 16px; font-size: 16px; margin-right: 10px; cursor: pointer; }
    #status { font-weight: bold; margin: 15px 0; padding: 8px; background-color: #f0f0f0; border-radius: 4px; }
    #log { width: 100%; height: 300px; background-color: #1e1e1e; color: #00ff00; font-family: monospace; padding: 10px; box-sizing: border-box; overflow-y: scroll; white-space: pre-wrap; }
  </style>

  <!-- Google公式 web-serial-polyfill (CDN) -->
  <script src="https://unpkg.com/web-serial-polyfill@1.0.15/dist/serial.js"></script>
</head>
<body>

  <h2>ESP32 WebUSB/WebSerial 接続テスト</h2>
  
  <div>
    <button id="btnConnect">USB 接続 (usbstart)</button>
    <button id="btnDisconnect" disabled>切断</button>
  </div>

  <div id="status">ステータス: 未接続</div>

  <h3>受信ログ</h3>
  <div id="log"></div>

  <script>
    let port = null;
    let reader = null;
    let keepReading = false;

    const btnConnect = document.getElementById('btnConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    // 画面ログ出力用関数
    function log(msg) {
      logDiv.textContent += msg + "\n";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // 接続処理
    btnConnect.addEventListener('click', async () => {
      try {
        log("接続を開始します...");

        // polyfillの取得（Web Serial API非対応ブラウザの場合はpolyfillのserialを使用）
        const serialPolyfill = window.navigator.serial || window.serial;

        if (!serialPolyfill) {
          alert("このブラウザは WebUSB / WebSerial に対応していません。");
          return;
        }

        // ESP32でよく使われるUSBシリアル変換ICのベンダーID一覧
        const filters = [
          { usbVendorId: 0x10C4 }, // CP2102 / CP2104 (Silicon Labs)
          { usbVendorId: 0x1A86 }, // CH340 / CH341 (Qinheng)
          { usbVendorId: 0x0403 }, // FT232R / FT232H (FTDI)
          { usbVendorId: 0x303A }, // ESP32-S2/S3 Native USB (Espressif)
          { usbVendorId: 0x2341 }  // Arduino
        ];

        // 1. デバイス選択ダイアログ表示
        port = await serialPolyfill.requestPort({ filters });
        log("デバイスが選択されました。ポートを開いています...");

        // 2. ポートのオープン（通信速度の設定）
        // ※ESP32側のSerial.begin(115200)や9600に合わせて変更してください
        await port.open({ baudRate: 115200 });

        // 3. ESP32のリセット固定化を防ぐ（DTR / RTS 信号設定）
        if (port.setSignals) {
          await port.setSignals({ dataTerminalReady: false, requestToSend: false });
        }

        statusDiv.textContent = "ステータス: 接続成功";
        statusDiv.style.backgroundColor = "#d4edda";
        btnConnect.disabled = true;
        btnDisconnect.disabled = false;
        log("接続に成功しました。データ受信を待機中...");

        // 4. 受信ループ開始
        keepReading = true;
        readLoop();

      } catch (err) {
        log("[エラー] 接続に失敗しました: " + err.message);
        statusDiv.textContent = "ステータス: 接続エラー";
        statusDiv.style.backgroundColor = "#f8d7da";
      }
    });

    // データ受信処理ループ
    async function readLoop() {
      const textDecoder = new TextDecoderStream();
      const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
      reader = textDecoder.readable.getReader();

      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          if (value) {
            log(value);
          }
        }
      } catch (err) {
        log("[エラー] 受信エラー: " + err.message);
      } finally {
        reader.releaseLock();
      }
    }

    // 切断処理
    btnDisconnect.addEventListener('click', async () => {
      keepReading = false;
      if (reader) {
        await reader.cancel();
      }
      if (port) {
        await port.close();
      }
      statusDiv.textContent = "ステータス: 切断済み";
      statusDiv.style.backgroundColor = "#f0f0f0";
      btnConnect.disabled = false;
      btnDisconnect.disabled = true;
      log("切断しました。");
    });
  </script>
</body>
</html>
